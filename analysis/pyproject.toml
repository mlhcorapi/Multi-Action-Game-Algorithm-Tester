[project]
name = "magat-analysis"
version = "0.1.0.dev6"
description = "MAGAT's analysis layer: paired, scenario-clustered measures of a multi-action search experiment"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
dependencies = ["numpy", "pandas"]

[project.optional-dependencies]
figures = ["matplotlib"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["magat_analysis"]
