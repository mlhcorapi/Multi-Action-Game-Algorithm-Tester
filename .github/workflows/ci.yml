name: MAGAT CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '11', '17', '21' ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Analysis dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Build
        run: python magat.py build --tests
      - name: Layering
        run: python magat.py layering
      - name: Unit tests (JUnit, then the analysis package)
        run: python magat.py test
      - name: Contract laws (Tribes, 4 published positions)
        run: python magat.py check contract --game tribes --scenarios 4
      - name: Equivalence gate (emcts and tbets vs the engine's agents, 2 positions, 8k units)
        run: python magat.py check equivalence --game tribes --arms emcts,tbets --scenarios 2 --visits 1 --budgets 8000
      - name: Equivalence gate (the AB-EMCTS arms vs the engine's agents, at the measurement weights, 2 positions, 8k units)
        run: python magat.py check equivalence --game tribes --arms @ab-emcts --no-weights --scenarios 2 --visits 1 --budgets 8000
      - name: Audit (each arm's declared operations and forward model account for its turn)
        run: python magat.py check audit --game tribes --arms @reference --budget 4000 --turns 2 --reps 1 --warmup 1
      - name: The R7615's published turns replay here field for field (2 per arm at 9,500, in the published currency)
        run: |
          for arm in emcts mcts oep tbets random; do
            python magat.py check replay --game tribes --leaf games/tribes/results/reference/r7615/all/$arm/9500cu --turns 2
          done
      - name: The laptop's published turns replay here too, in the laptop's currency
        run: |
          for arm in emcts mcts oep tbets random; do
            python magat.py check replay --game tribes --leaf games/tribes/results/reference/laptop-i9-14900hx/all/$arm/9500cu \
              --weights games/tribes/calibration/laptop-i9-14900hx-time/compute_weights.properties --turns 2
          done
      - name: Published portfolio verifies (bins, identity, split rule)
        run: python magat.py portfolio verify --game tribes
      - name: Toy portfolio build, freeze, and verify against the published rows
        run: |
          python magat.py portfolio build --game tribes --out "$RUNNER_TEMP/toy" --targets single=2,dual=1 --threads 2
          python magat.py portfolio freeze --portfolio "$RUNNER_TEMP/toy"
          python magat.py portfolio verify --game tribes --portfolio "$RUNNER_TEMP/toy" --published games/tribes/portfolio/v1 --subset --plan 3
      - name: Toy calibration writes, and checks without writing
        run: |
          python magat.py machine
          python magat.py calibrate --estimate --game tribes --arms emcts --levels 2000,4000 --reps 2 --turns 2 --warmup 1 --toy | grep -q "ESTIMATE: "
          python magat.py calibrate --game tribes --out "$RUNNER_TEMP/calib" --arms @reference --levels 2000,4000 --reps 2 --turns 2 --warmup 1 --toy
          grep -q "magat.weights.version = 2" "$RUNNER_TEMP/calib/compute_weights.properties"
          grep -q "profile.emcts@4000.w.emcts.generation" "$RUNNER_TEMP/calib/compute_weights.properties"
          grep -q "profile.tbets@4000.w.tbets.turn" "$RUNNER_TEMP/calib/compute_weights.properties"
          # a toy drift verdict may land either side of the gate (exit 0 or 1); anything else is a failure
          rc=0; python magat.py calibrate --check --game tribes --weights "$RUNNER_TEMP/calib/compute_weights.properties" --arms emcts --levels 4000 --reps 2 --warmup 1 --toy || rc=$?
          test "$rc" -le 1
      - name: Controlled toy calibration (preflight, one session and the self-check, a priced currency not measured again)
        run: |
          CC="--name ci --toy --out $RUNNER_TEMP/controlled --arms emcts --levels 2000,4000 --turns 2 --reps 2 --warmup 1 --soak-minutes 0 --interval 2"
          python magat.py calibrate-controlled $CC --preflight | grep -q "PREFLIGHT: READY"
          python magat.py calibrate-controlled $CC > "$RUNNER_TEMP/controlled.log" || { tail -80 "$RUNNER_TEMP/controlled.log"; exit 1; }
          grep -q "CONTROLLED CALIBRATION: COMPLETE" "$RUNNER_TEMP/controlled.log"
          grep -q "profile.emcts@4000.w.advance" "$RUNNER_TEMP/controlled/compute_weights.properties"
          grep -q "^- Verdict: COMPLETE" "$RUNNER_TEMP/controlled/record/SUMMARY.md"
          python magat.py calibrate-controlled $CC | grep -q "nothing to measure"
          echo "{\"name\": \"ci\", \"toy\": true, \"out\": \"$RUNNER_TEMP/controlled\", \"arms\": [\"emcts\"], \"levels\": [2000, 4000], \"turns\": \"2\", \"reps\": \"2\", \"warmup\": \"1\", \"soak-minutes\": 0, \"interval\": 2}" > "$RUNNER_TEMP/controlled.json"
          python magat.py calibrate-controlled --config "$RUNNER_TEMP/controlled.json" | grep -q "nothing to measure"
      - name: Every example calibration config reads, and its preflight says what it would measure
        run: |
          for cfg in calibrations/tribes/examples/*.json; do
            python magat.py calibrate-controlled --config "$cfg" --out "$RUNNER_TEMP/config-$(basename "$cfg" .json)" --preflight --toy | grep -q "4 arm(s): emcts, mcts, oep, tbets"
          done
      - name: The shipped experiment spec validates against the published currency
        run: python magat.py experiment validate --experiment experiments/tribes/reference.json
      - name: Every example spec validates against the currency it names
        run: |
          for spec in experiments/tribes/examples/*.json; do
            python magat.py experiment validate --experiment "$spec"
          done
      - name: Toy run on dev and holdout, a resume that skips every leaf, and a second run that reuses every leaf
        run: |
          RUN="python magat.py run --experiment experiments/tribes/shakedown.json --portfolio $RUNNER_TEMP/toy --weights $RUNNER_TEMP/calib/compute_weights.properties --out $RUNNER_TEMP/run --threads 2 --toy"
          $RUN --split dev
          $RUN --split dev | grep -q "SKIP (done)"
          $RUN --split holdout
          test "$(wc -l < "$RUNNER_TEMP/run/dev/_completed.txt")" -eq 10
          head -1 "$RUNNER_TEMP/run/dev/emcts/2000cu/turns.csv" | grep -q "op_emcts.generation"
          head -1 "$RUNNER_TEMP/run/dev/tbets/2000cu/turns.csv" | grep -q "op_tbets.turn"
          test "$(python magat.py run --experiment experiments/tribes/shakedown.json --portfolio $RUNNER_TEMP/toy --weights $RUNNER_TEMP/calib/compute_weights.properties --out $RUNNER_TEMP/run-reused --threads 2 --toy --split dev --reuse $RUNNER_TEMP/run/dev | grep -c "REUSED")" -eq 10
      - name: experiment run takes a spec in the short forms from validation to its report and bundle, and resumes
        run: |
          echo '{"name": "short", "game": "tribes", "baseline": "emcts", "arms": ["emcts", "random"], "levels": [2000, 4000], "repetitions": 1, "split": "all", "sources": ["single"]}' > "$RUNNER_TEMP/short.json"
          ER="python magat.py experiment run $RUNNER_TEMP/short.json --portfolio $RUNNER_TEMP/toy --weights $RUNNER_TEMP/calib/compute_weights.properties --out $RUNNER_TEMP/short --results $RUNNER_TEMP/short-results --threads 2 --toy"
          $ER > "$RUNNER_TEMP/short.log" || { tail -60 "$RUNNER_TEMP/short.log"; exit 1; }
          grep -q "EXPERIMENT: COMPLETE" "$RUNNER_TEMP/short.log"
          grep -q '"selection": "sources=single"' "$RUNNER_TEMP/short/all/_run.json"
          grep -q "positions selected | sources=single" "$RUNNER_TEMP/short-results/SUMMARY.md"
          python -c "import os, pathlib, sys, zipfile; d = pathlib.Path(os.environ.get('MAGAT_DATA') or pathlib.Path.home() / 'magat_runs'); z = zipfile.ZipFile(d / 'bundles' / 'run-short.zip'); sys.exit(0 if any(n.endswith('SUMMARY.md') for n in z.namelist()) else 1)"
          $ER | grep -q "SKIP (done)"
      - name: experiment run takes the published run's leaves played at its prices, and plays the rest
        run: |
          echo '{"name": "reuse", "game": "tribes", "arms": ["emcts", "random"], "baseline": "emcts", "levels": [9500, {"budget": "1000ms", "repetitions": 9, "arms": ["random"]}], "repetitions": 2, "split": "all", "ids": [1, 2, 3]}' > "$RUNNER_TEMP/reuse.json"
          python magat.py experiment run "$RUNNER_TEMP/reuse.json" --out "$RUNNER_TEMP/reuse" --results "$RUNNER_TEMP/reuse-results" --no-bundle > "$RUNNER_TEMP/reuse.log" || { tail -60 "$RUNNER_TEMP/reuse.log"; exit 1; }
          grep -q "REUSED arm=emcts;budget=9500" "$RUNNER_TEMP/reuse.log"
          grep -q "REUSED arm=random;budget=9500" "$RUNNER_TEMP/reuse.log"
          grep -q "random@20000 is played: the published leaf holds 24 of the 27 turns" "$RUNNER_TEMP/reuse.log"
          grep -q "leaves reused" "$RUNNER_TEMP/reuse-results/SUMMARY.md"
      - name: Analyze the toy run, re-priced in its own currency, and beside itself as another machine's
        run: |
          python magat.py analyze --run "$RUNNER_TEMP/run" --reprice "$RUNNER_TEMP/calib/compute_weights.properties" --out "$RUNNER_TEMP/analysis"
          for t in headline budget_multiplier wallclock contrasts variance spend repriced; do
            test -s "$RUNNER_TEMP/analysis/tables/$t.csv"
          done
          python magat.py analyze --run "$RUNNER_TEMP/run" --compare "$RUNNER_TEMP/run" --out "$RUNNER_TEMP/compare"
          test -s "$RUNNER_TEMP/compare/tables/across.csv"
          grep -q "## Across machines (dev)" "$RUNNER_TEMP/compare/SUMMARY.md"
      - name: A result exported, imported into another data root and checked there; an edited package refused
        run: |
          python magat.py export $RUNNER_TEMP/run --name toy-run --out $RUNNER_TEMP/toy-run.magat.zip | grep -q "EXPORT: "
          MAGAT_DATA=$RUNNER_TEMP/elsewhere python magat.py import $RUNNER_TEMP/toy-run.magat.zip --replay 1 > "$RUNNER_TEMP/import.log" || { tail -40 "$RUNNER_TEMP/import.log"; exit 1; }
          grep -q "IMPORT: VERIFIED" "$RUNNER_TEMP/import.log"
          python -c "import sys, zipfile; z = zipfile.ZipFile(sys.argv[1]); w = zipfile.ZipFile(sys.argv[2], 'w'); [w.writestr(n, z.read(n) + (b' ' if n.endswith('_run.json') else b'')) for n in z.namelist()]; w.close()" $RUNNER_TEMP/toy-run.magat.zip $RUNNER_TEMP/edited.magat.zip
          MAGAT_DATA=$RUNNER_TEMP/elsewhere python magat.py import $RUNNER_TEMP/edited.magat.zip --name edited | grep -q "IMPORT: REFUSED"
          test ! -e $RUNNER_TEMP/elsewhere/imports/edited
      - name: The published R7615 run exported, imported into another data root, and verified on this machine
        run: |
          python magat.py export games/tribes/results/reference/r7615/all --out $RUNNER_TEMP/r7615.magat.zip | grep -q "EXPORT: "
          MAGAT_DATA=$RUNNER_TEMP/elsewhere python magat.py import $RUNNER_TEMP/r7615.magat.zip --replay 1 > "$RUNNER_TEMP/import-r7615.log" || { tail -40 "$RUNNER_TEMP/import-r7615.log"; exit 1; }
          grep -q "IMPORT: VERIFIED" "$RUNNER_TEMP/import-r7615.log"
      - name: The two published runs compare as docs/results/cross-machine.md says
        run: |
          python magat.py analyze --run games/tribes/results/reference/r7615 --compare games/tribes/results/reference/laptop-i9-14900hx --out "$RUNNER_TEMP/cross-machine"
          # The agreement table has no bootstrap, so it is the same on any numpy.
          diff games/tribes/results/reference/r7615-vs-laptop-i9-14900hx/tables/agreement.csv "$RUNNER_TEMP/cross-machine/tables/agreement.csv"
      - name: The paper's tables rebuild from the published artefacts, byte for byte, and its figures render
        run: python magat.py paper --check
      - name: Notebook self-test
        run: python magat.py notebook selftest
