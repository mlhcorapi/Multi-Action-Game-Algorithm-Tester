name: MAGAT CI

# One suite of checks, tools/shakedown.py, which is also what a contributor runs before pushing: adding a check
# there adds it here. A pull request is ready to merge when every job below is green.

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  # A newer push to the same pull request replaces the run in progress.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    # The whole suite on the reference machine's Java (11, as on the R7615), on both systems MAGAT runs on.
    name: suite (${{ matrix.os }}, JDK 11)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Analysis dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: The shakedown (every check, at toy size)
        run: python magat.py shakedown
      - name: The logs, when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: ~/magat_runs/logs

  compat:
    # Later Java versions: the code builds, its tests pass, and the ports still play their originals' turns.
    name: compat (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Analysis dependencies
        run: python -m pip install --quiet -r requirements.txt
      - name: Build
        run: python magat.py build --tests
      - name: Unit tests
        run: python magat.py test
      - name: Every ported arm against its original, on 2 positions
        run: python magat.py check equivalence --game tribes --scenarios 2 --visits 1 --budgets 8000

  equivalence:
    # The full gate, every ported arm on 32 cells with its mechanism's counters, when the code an arm's turns depend
    # on changes: the algorithms, the game adapter, the meter, or the engine.
    name: equivalence (32 cells per arm)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Whether algorithm, game or engine code changed
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; else base="${{ github.event.before }}"; fi
          if ! changed=$(git diff --name-only "$base" HEAD -- core/src games/tribes/src games/tribes/engine 2>/dev/null); then
            echo "the base $base is not in this clone: gate anyway"; echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$changed" ]; then
            echo "$changed"; echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "no algorithm, game or engine code changed: nothing for the full gate to check"; echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.changed.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: '11'
      - uses: actions/setup-python@v5
        if: steps.changed.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Every ported arm against its original, 8 positions x 2 visits x 2 budgets
        if: steps.changed.outputs.run == 'true'
        run: python magat.py check equivalence --game tribes
